<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Slow SPA test</title></head><body><div id="app">載入中…</div>
<script>
// The placeholder stays still for ~3 s before the body appears: longer than the old "text length stable for 0.6 s" rule, so this confirms we don't finish early
setTimeout(() => {
  document.getElementById('app').innerHTML =
    '<article><h1>A slowly rendered article</h1><p>LATE-RENDERED This text is generated by JavaScript three seconds after the page loads. This paragraph is deliberately long so the main-content extractor treats it as article text rather than navigation bars, ads or other noise. This paragraph is deliberately long so the main-content extractor treats it as article text.</p></article>';
}, 3000);
</script></body></html>
